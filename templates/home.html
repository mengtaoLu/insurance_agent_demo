<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            background: #f5f6f8;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 左侧 Chat 列表 */
        .sidebar {
            width: 260px;
            background: #111827;
            color: white;

            display: flex;
            flex-direction: column;

            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #374151;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px;

            border: 1px solid #4b5563;
            border-radius: 8px;

            background: #1f2937;
            color: white;

            cursor: pointer;
        }

        .new-chat-btn:hover {
            background: #374151;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-item {
            display: block;

            padding: 12px;
            margin-bottom: 6px;

            border-radius: 8px;

            color: #d1d5db;
            text-decoration: none;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item:hover {
            background: #1f2937;
        }

        .chat-item.active {
            background: #374151;
            color: white;
        }

        /* 右侧主体 */
        .content {
            flex: 1;

            display: flex;
            flex-direction: column;

            min-width: 0;
        }

        /* 顶部 */
        .header {
            height: 64px;

            background: white;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            flex-shrink: 0;
        }

        .title {
            font-size: 18px;
            font-weight: 600;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .username {
            font-size: 14px;
            color: #374151;
        }

        .logout-btn {
            border: none;
            background: #ef4444;
            color: white;

            padding: 8px 14px;
            border-radius: 6px;

            cursor: pointer;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* 消息区域 */
        .main {
            flex: 1;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .messages {
            flex: 1;

            overflow-y: auto;

            padding: 24px 32px 120px;

            width: 100%;
        }

        .message-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .message-row {
            display: flex;
            margin-bottom: 20px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.assistant {
            justify-content: flex-start;
        }

        .message {
            max-width: 70%;

            padding: 12px 16px;

            border-radius: 12px;

            line-height: 1.6;
            font-size: 15px;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .user .message {
            background: #2563eb;
            color: white;

            border-bottom-right-radius: 4px;
        }

        .assistant .message {
            background: white;
            color: #1f2937;

            border: 1px solid #e5e7eb;

            border-bottom-left-radius: 4px;
        }

        .empty {
            text-align: center;
            color: #9ca3af;

            margin-top: 100px;
        }

        /* 底部输入框 */
        .input-area {
            position: absolute;

            left: 260px;
            right: 0;
            bottom: 0;

            padding: 16px 32px 20px;

            background: linear-gradient(
                to top,
                #f5f6f8 75%,
                rgba(245, 246, 248, 0)
            );
        }

        .input-box {
            max-width: 900px;

            margin: 0 auto;

            display: flex;
            align-items: flex-end;
            gap: 12px;

            background: white;

            border: 1px solid #d1d5db;
            border-radius: 14px;

            padding: 10px 12px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        textarea {
            flex: 1;

            border: none;
            outline: none;
            resize: none;

            font-size: 15px;
            line-height: 1.5;

            min-height: 44px;
            max-height: 160px;

            padding: 10px;

            font-family: inherit;
        }

        .send-btn {
            border: none;

            width: 44px;
            height: 44px;

            border-radius: 10px;

            background: #2563eb;
            color: white;

            cursor: pointer;

            font-size: 18px;
        }

        .send-btn:hover {
            background: #1d4ed8;
        }

        .send-btn:focus-visible,
        .new-chat-btn:focus-visible,
        .logout-btn:focus-visible,
        .chat-item:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 2px;
        }

        .send-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
    </style>
</head>

<body>

<!-- 左侧 Chat 列表 -->
<aside class="sidebar">

    <div class="sidebar-header">

        <form action="/chat/new" method="post">
            <button
                type="submit"
                class="new-chat-btn"
            >
                + 新建对话
            </button>
        </form>

    </div>

    <div class="chat-list">

        {% for chat in chats %}

            <a
                href="/chat/{{ chat.id }}"
                class="
                    chat-item
                    {% if current_chat and chat.id == current_chat.id %}
                        active
                    {% endif %}
                "
            >
                {{ chat.title or "新对话" }}
            </a>

        {% endfor %}

    </div>

</aside>


<!-- 右侧主体 -->
<div class="content">

    <!-- 顶部 -->
    <header class="header">

        <div class="title">

            {% if current_chat %}
                {{ current_chat.title or "新对话" }}
            {% else %}
                Agent
            {% endif %}

        </div>

        <div class="user-area">

            <span class="username">
                {{ username }}
            </span>

            <form
                action="/logout"
                method="post"
            >
                <button
                    class="logout-btn"
                    type="submit"
                >
                    Logout
                </button>
            </form>

        </div>

    </header>


    <!-- 消息 -->
    <main class="main">

        <div
            class="messages"
            id="messages"
        >

            <div class="message-container">

                {% if messages %}

                    {% for message in messages %}

                        <div class="message-row {{ message.role }}">

                            <div class="message">
                                {{ message.content }}
                            </div>

                        </div>

                    {% endfor %}

                {% else %}

                    <div class="empty">
                        开始和 Agent 对话吧
                    </div>

                {% endif %}

            </div>

        </div>

    </main>

</div>


<!-- 输入框 -->
<div class="input-area">

    <form
        action="{% if current_chat %}/chat/{{ current_chat.id }}{% else %}/chat{% endif %}"
        method="post"
        class="input-box"
        id="message-form"
    >

        <textarea
            id="input"
            name="message"
            placeholder="给 Agent 发送消息..."
            rows="1"
            required
        ></textarea>

        <button
            class="send-btn"
            type="submit"
            id="send-button"
            aria-label="发送消息"
            title="发送消息"
            disabled
        >
            ↑
        </button>

    </form>

</div>


<script>

    const input =
        document.getElementById("input");
    const form =
        document.getElementById("message-form");
    const sendButton =
        document.getElementById("send-button");

    function updateSendButton() {
        sendButton.disabled = input.value.trim().length === 0;
    }

    // textarea 自动调整高度
    input.addEventListener(
        "input",
        function () {

            this.style.height = "auto";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    160
                ) + "px";

            updateSendButton();
        }
    );


    // Enter 发送
    // Shift + Enter 换行
    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
                && !event.shiftKey
            ) {

                event.preventDefault();

                if (this.value.trim()) {
                    this.form.requestSubmit();
                }
            }

        }
    );


    // 自动滚动到底部
    const messages =
        document.getElementById("messages");

    messages.scrollTop =
        messages.scrollHeight;

    form.addEventListener("submit", function (event) {
        if (!input.value.trim()) {
            event.preventDefault();
            return;
        }

        sendButton.disabled = true;
        sendButton.textContent = "…";
    });

    updateSendButton();

</script>

</body>
</html>
